# Netlify yapılandırması – derleme yok, sadece fonksiyonlar
[build]
  publish = "."
  command = ""
  functions = "netlify/functions"

[functions]
  node_bundler = "zisi"

# --- http → https ve www → kök alan adı (kalıcı yönlendirme) ---
[[redirects]]
  from = "http://kurabiyes.com/*"
  to = "https://kurabiyes.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.kurabiyes.com/*"
  to = "https://kurabiyes.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.kurabiyes.com/*"
  to = "https://kurabiyes.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200

# --- .html uzantısız adresler (mevcut sayfalar) ---
# Eskiden her bilinmeyen adres ana sayfayı döndürüyordu (/kvkk, /iletisim ...).
# Artık sadece aşağıdaki gerçek sayfalar açılır; diğerleri 404.html ile gerçek 404 verir.
[[redirects]]
