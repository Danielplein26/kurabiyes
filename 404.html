<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Sayfa bulunamadı — Kurabiye's</title>
<style>
  body{font-family:'Mukta',system-ui,sans-serif;background:#f9f1e3;color:#33201a;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:24px;margin:0;}
  .box{background:#fff;border-radius:18px;padding:48px 36px;max-width:480px;box-shadow:0 14px 34px rgba(58,15,22,0.18);}
  h1{font-family:'Cormorant Garamond',Georgia,serif;color:#7d1f2c;margin:0 0 12px;font-size:2.2rem;}
  p{margin:0 0 8px;color:#5d4536;}
  a.home-btn{display:inline-block;margin-top:20px;background:#d9803f;color:#fff;text-decoration:none;padding:12px 28px;border-radius:999px;font-weight:700;}
</style>
</head>
<body>
  <div class="box">
    <h1>Aradığınız sayfa bulunamadı</h1>
    <p>Adres değişmiş ya da yanlış yazılmış olabilir.</p>
    <a class="home-btn" href="/">Ana Sayfaya Dön</a>
  </div>
</body>
</html>
